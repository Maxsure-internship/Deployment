<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Harness the power of AI and machine learning to identify the most suitable crops for your land and maximize agricultural productivity."
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/output-style.css')}}"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/custom-style.css')}}"
    />
    <title>{% block title %} Fasal Guru {% endblock %}</title>
  </head>
  <body class="bg-black">
    <!-- Flash Messages -->
    {% include "components/header.html" %}
    <main class="pt-20 relative overflow-y-scroll">
      {% with messages = get_flashed_messages() %} {% if messages %}
      <div class="fixed top-24 right-6 z-50 flex flex-col gap-3">
        {% for message in messages %}
        <div
          class="flash-message flex items-start gap-3 max-w-sm p-4 rounded-xl border border-yellow-200 bg-yellow-500/10 backdrop-blur-md shadow-xl animate-slide-in"
        >
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-yellow-500/50 text-yellow-300"
          >
            <i data-lucide="info" class="h-5 w-5"></i>
          </div>

          <div class="flex-1">
            <h4 class="font-bold text-yellow-400 text-2xl">Alert!</h4>
            <p class="text-sm text-yellow-300">{{ message }}</p>
          </div>

          <button
            onclick="this.parentElement.remove()"
            class="text-slate-500 hover:text-slate-300 transition"
          >
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %} {% block content %}{% endblock %}
    </main>
    {% include "components/footer.html" %}
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons({
        attrs: {
          class: ["icon"],
          "stroke-width": 2,
          stroke: "#333",
        },
      });
    </script>
  </body>
</html>
